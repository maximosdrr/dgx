services:
  postgres:
    image: postgres:16-alpine
    container_name: docgen_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docgen
      POSTGRES_USER: docgen
      POSTGRES_PASSWORD: docgen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgen -d docgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docgen_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: docgen
      MINIO_ROOT_PASSWORD: docgen123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: docgen_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 docgen docgen123 &&
      mc mb local/docgen-documents --ignore-existing &&
      mc anonymous set download local/docgen-documents &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: docgen_gotenberg
    restart: unless-stopped
    ports:
      - "3002:3000"
    command:
      - "gotenberg"
      - "--chromium-disable-routes=false"

volumes:
  postgres_data:
  minio_data:
